[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tommypotta-piientity"
version = "0.1.0"
description = "用一组明示的正则规则扫描输入，报告训练数据的隐私实体相关的命中行与片段"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "tommypotta" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://tommypotta.github.io"
Repository = "https://github.com/tommypotta/piientity"
Issues = "https://github.com/tommypotta/piientity/issues"

[project.scripts]
piientity = "piientity:main"

[tool.setuptools]
py-modules = ["piientity"]
